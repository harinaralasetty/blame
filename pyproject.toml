[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blame-cli"
version = "0.1.0"
description = "Offline triage of lost evaluation rubric points"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hari Naralasetty"}]
dependencies = []

[project.scripts]
blame = "blame_cli.cli:main"

[tool.setuptools]
packages = ["blame_cli"]
